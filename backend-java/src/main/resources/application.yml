spring:
  application:
    name: refurbished-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

# Tài liệu tương tác dùng để thử API local; không tự bật ở môi trường mới.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
    tags-sorter: alpha
    operations-sorter: alpha
    disable-swagger-default-url: true
  paths-to-match: /api/**

app:
  security:
    jwt:
      secret: ${REFURBISHED_JWT_SECRET:}
      issuer: refurbished-backend
      access-token-minutes: 30
    google:
      client-id: ${REFURBISHED_GOOGLE_CLIENT_ID:}
      client-secret: ${REFURBISHED_GOOGLE_CLIENT_SECRET:}
      frontend-callback: ${REFURBISHED_OAUTH_FRONTEND_CALLBACK:http://127.0.0.1:5173/oauth/callback}
