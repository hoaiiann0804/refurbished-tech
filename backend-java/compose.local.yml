name: refurbished-java-local

services:
  db-dev:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: refurbished_dev
      POSTGRES_USER: refurbished_admin
      POSTGRES_PASSWORD: ${REFURBISHED_DEV_ADMIN_PASSWORD:?Run Initialize-Local.ps1 first}
      APP_DB_USER: refurbished_app
      APP_DB_PASSWORD: ${REFURBISHED_DEV_PASSWORD:?Run Initialize-Local.ps1 first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - refurbished_dev_data:/var/lib/postgresql/data
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U refurbished_admin -d refurbished_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-test:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: refurbished_test
      POSTGRES_USER: refurbished_test_admin
      POSTGRES_PASSWORD: ${REFURBISHED_TEST_ADMIN_PASSWORD:?Run Initialize-Local.ps1 first}
      APP_DB_USER: refurbished_test
      APP_DB_PASSWORD: ${REFURBISHED_TEST_PASSWORD:?Run Initialize-Local.ps1 first}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U refurbished_test_admin -d refurbished_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  refurbished_dev_data:
